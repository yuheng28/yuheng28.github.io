<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry Syllabus Objective Randomizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }
        .fade-out {
            animation: fadeOut 0.3s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-10px); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 sm:p-8">

    <div class="max-w-3xl w-full bg-white rounded-3xl shadow-xl border border-slate-100 p-8 sm:p-12 text-center relative overflow-hidden">
        <!-- Decorative Background Element -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-blue-50 rounded-full blur-3xl opacity-60 pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-56 h-56 bg-indigo-50 rounded-full blur-3xl opacity-60 pointer-events-none"></div>

                <p id="objective-text" class="text-2xl sm:text-3xl font-medium text-slate-800 leading-snug transition-opacity duration-300">
                    <!-- Objective will be injected here -->

                Show Random Objective
            </button>
        </div>
    </div>

        const objectiveElement = document.getElementById('objective-text');
        const generateBtn = document.getElementById('generate-btn');
        let currentIndex = -1;

        function getRandomObjective() {
            if (objectives.length === 0) return "No objectives found.";
            
            let newIndex;
            // Ensure we don't pick the same objective twice in a row
            do {
                newIndex = Math.floor(Math.random() * objectives.length);
            } while (newIndex === currentIndex && objectives.length > 1);
            
            currentIndex = newIndex;
            return objectives[currentIndex];
        }

        function updateObjectiveUI() {
            // Apply fade-out
            objectiveElement.classList.remove('fade-in');
            objectiveElement.classList.add('fade-out');

            setTimeout(() => {
                // Update text while invisible
                objectiveElement.textContent = getRandomObjective();
                
                // Apply fade-in
                objectiveElement.classList.remove('fade-out');
                objectiveElement.classList.add('fade-in');
            }, 300); // matches the duration of the fadeOut animation
        }

        // Event listener for button
        generateBtn.addEventListener('click', updateObjectiveUI);

        // Initialize with a random objective on load
        objectiveElement.textContent = getRandomObjective();
        objectiveElement.classList.add('fade-in');
    </script>
</body>
</html>
